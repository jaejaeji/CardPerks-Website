<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jae">
    <meta name="description" content="Cardperks - View your credit card benefits in one website">
    <title>CardPerks Main</title>
    <link rel="stylesheet" href="styles_sign_in.css">
    <script src="script.js"></script>
</head>
<body>

    <div class="container">
        <header class="header">
            <a class="title" href=".\index.html">CARDPERKS</a>
        </header>

        <div class="login_box">

            <div class="login_section1">

                <h2>Sign Up</h2>

                <label class="first_name" for="first_name">First Name: 
                <input type="text" id="first_name" required /></label>
                
                <label class="last_name" for="last_name">Last Name: 
                <input type="text" id="last_name" required /></label>
                
                <label class="email" for="email">Email: 
                <input type="email" id="user_email" required /></label> 

                <label class="password" for="password">Password: 
                <input type="password" id="user_password" required /></label>
            </div>


            <div class="login_section2">
                <div class="login_subsection1">
                    <a class="google_login" href="https://google.com">Google Login</a>
                </div>

                <div class="login_subsection2">
                    <p>Forgot password? Click <a class="help" href=".\help.html">Here</a></p>
                    <p>Already have have an account? <a class="signin" href=".\sign_in.html">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
