<body>

    <div class="container">
        <header class="header">
            <a class="title" href=".\main.html">CARDPERKS</a>
        </header>

        <div class="inside_container">

            <h2>Sign In</h2>
                <label class="email" for="email">
                    Email: 
                    <input type="email" id="user_email" required />
                </label>
                <label class="password" for="password">
                    Password: 
                    <input type="password" id="user_password" required />
                </label>
                
                <div class="login">
                    <a class="google_login" href="https://google.com">Google Login</a>
                </div>

                <div class="links">
                    <p>Forgot password? Click <a class="help" href=".\help.html">Here</a></p>
                    <p>Already have have an account? <a class="signin" href=".\sign_in.html">Sign In</a></p>
                </div>
        </div>

    </div>
